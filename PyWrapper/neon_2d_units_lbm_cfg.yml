description: Accompanying MD simulation for the SmallNeon LBM

setup:
  seed: 42
  dimensions: 2
  size: 3.48 um
  max_speed: 1006 m/s # this is NOT sqrt(v_avg^2) but rather sqrt(3*v_avg^2) as the expected value of a var squared is not the squared one of the var itself
  dump_interval: 5 ps
  max_sim_time: 1 ns

species:
  - name: A
    mass: 20.180 u
    radius: 154 pm
    color: 0xFF0000
    quantity: 1000000
